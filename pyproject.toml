[project]
name = "cf"
version = "1.0.0"
description = "A package for computing contextuality related stuff"
authors = [
    {name = "Kim Vallée", email = "kim.vallee@protonmail.com"},
    {name = "Adel Sohbi"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cvxpy (>=1.7.3,<2.0.0)",
    "mosek (>=11.0.29,<12.0.0)",
    "notebook (>=7.4.7,<8.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "pycddlib (>=3.0.2,<4.0.0)",
    "sphinx (>=8.2.3,<9.0.0)",
    "sphinx-rtd-theme (>=3.0.2,<4.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "pytest (>=8.4.2,<9.0.0)"
]
keywords = ["python", "contextual-fraction", "contextuality"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
